<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero-picture</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.png">
    <style>
        picture {
            display: block;
            width: 100%;
        }

        picture img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <h1>Vuoret</h1>
    <p>Avaa tämä sivu eri laitteilla!</p>
    <picture>
        <source media="(max-width: 600px)" srcset="../image/vuori-small.webp" type="image/webp">

        <source media="(min-width: 601px)" srcset="../image/vuori-big.webp" type="image/webp">

        <img src="../image/vuori.jpg" alt="kuvia vuorista">

    </picture>

    <footer>
        <nav>
            <a href="../index.html">Etusivulle</a>
        </nav>
        <p>&copy; 2026 Violeta Bielinska</p>
    </footer>
</body>

</html>
