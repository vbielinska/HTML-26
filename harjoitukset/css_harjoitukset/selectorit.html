<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectorit</title>
    <link rel="stylesheet" href="../../css/selectorit.css">
</head>

<body>
    <h1>Harjoitus 1</h1>
    <article class="post">
        <h2>Otsikko</h2>
        <p>Johdanto</p>
        <section>
            <p>Leipäteksti</p>
        </section>
    </article>
    <h2>Harjoitus 2</h2>
    <form>
    <div class="form-group">
        <label for="email">Sähköposti:</label>
        <input type="email" id="email" required>
    </div>

    <div class="form-group">
        <label for="name">Nimi:</label>
        <input type="text" id="name" required>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" id="terms">
            Hyväksyn ehdot
        </label>
    </div>

    <button type="submit">Lähetä</button>
</form>

</body>

</html>
