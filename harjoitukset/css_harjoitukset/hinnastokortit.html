<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinnastokortit</title>
    <link rel="stylesheet" href="../../css/css_harjoitukset/hinnastokortit.css">
</head>
<body>
    <header>
    <h1>Kukkakauppa</h1>
    <p><p>Tässä tehtävässä tein kolme tuotekorttia. Käytin Box Modelia.</p></p>
    </header>
    <main>
        <div class="product-container">
        <article class="product-card">
            <h2 class="product-name">Tulppaanit</h2>
            <img class="product-image" src="../../images/css_harjoitukset/tulip.jpg" alt="Vaaleanpunainen tulppaanikimppu">
            <p class="product-price">10€</p>
            <p class="product-description">Kaunis vaaleanpunainen tulppaanikimppu.</p>
            <button>Lisää koriin</button>
        </article>
        <article class="product-card">
            <h2 class="product-name">Ruusut</h2>
            <img class="product-image" src="../../images/css_harjoitukset/roses.jpg" alt="Vaaleanpunainen ruusukimppu">
            <p class="product-price">15€</p>
            <p class="product-description">Romanttinen ruusukimppu erityisiin hetkiin.</p>
            <button>Lisää koriin</button>
        </article>
        <article class="product-card">
            <h2 class="product-name">Auringonkukat</h2>
            <img class="product-image" src="../../images/css_harjoitukset/sunflower.jpg" alt="Keltainen auringonkukkakimppu"">
            <p class="product-price">12€</p>
            <p class="product-description"> Iloinen ja värikäs auringonkukkakimppu.</p>
            <button>Lisää koriin</button>
        </article>
        </div>
    </main>
    <footer>
        <nav>
           <p><a href="../../index.html">Etusivu</a></p> 
        </nav>
    </footer>

</body>
</html>
