<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuvagalleria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.png">
</head>

<body>
    <header>
        <h1>Kuvagalleria - Minun kiinnostuksen kohteeni</h1>
        <p>Tervetuloa kuvagalleriaani! Täältä löydät kuvia harrastuksistani ja asioista, joista pidän.</p>
    </header>
    <main>
        <section id="Kuvagalleria">
            <h2>Harrastukseni</h2>
            <figure>
                <figcaption>Tykkään käydä museoissa</figcaption>
                <img src="../../images/html_harjoitukset/taide.png" alt="Valokuva museosta" width="200"
                    image-resolution:300dpi;>
            </figure>
            <figure>
                <figcaption>Rakastan kirjojjen likemista</figcaption>
                <img src="../../images/html_harjoitukset/kirjat.png" alt="Valokuva kirjoista" width="200"
                    image-resolution:300dpi;>
            </figure>
            <figure>
                <figcaption>Pidän matkustamisesta</figcaption>
                <img src="../../images/html_harjoitukset/lentokone.png" alt="Valokuva lentokoneen siivestä" width="200"
                    image-resolution:300dpi;>
            </figure>
        </section>
    </main>
    <footer>
        <nav>
            <a href="../../index.html">Etusivulle</a>
        </nav>
    </footer>
</body>

</html>
