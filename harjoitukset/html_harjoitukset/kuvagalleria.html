<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuvagalleria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.png">
</head>

<body>
    <header>
        <h1>Kuvagalleria - Minun kiinnostuksen kohteeni</h1>
        <p>Tervetuloa kuvagalleriaani! Täältä löydät kuvia opiskelustani, harrastuksistani ja asioista, joista pidän.
        </p>

    </header>
    <main>
        <section id="Kuvagalleria">
            <h2>Harrastukseni</h2>
            <figure>
                <figcaption>Tykkään käydä museoissa</figcaption>
                <img src="../image/taide.png" alt="Valokuva museosta" width="400">
            </figure>
            <figure>
                <figcaption>Rakastan kirjojjen likemista</figcaption>
                <img src="../image/kirjat.png" alt="Valokuva kirjoista" width="400">
            </figure>
            <figure>
                <figcaption>Pidän matkustamisesta</figcaption>
                <img src="../image/lentokone.png" alt="Valokuva lentokoneen siivestä" width="400">
            </figure>
            <figure>
                <figcaption>Rakastan luontoa</figcaption>
                <img src="../image/luonto.png" alt="Valokuva joesta" width="400">
            </figure>
        </section>
    </main>
    <footer>
        <nav>
            <a href="../index.html">Etusivulle</a>
        </nav>
        <p>&copy; 2026 Violeta Bielinska</p>
    </footer>
</body>

</html>
