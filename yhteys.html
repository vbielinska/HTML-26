<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yhteys</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>

<body>
    <header>
        <h1>Yhteys</h1>
        <p>Haluatko ottaa minuun yhteyttä? Lähetä minulle viesti!</p>
        <nav>
            <a href="index.html" target="_blank" rel="noopener noreferrer">Etusivu</a>
            <a href="kuvagalleria.html" target="_blank" rel="noopener noreferrer">Kuvagalleria</a>
        </nav>
    </header>
    <main>
        <h2>Yhteystietoni</h2>
        <address>
            <p>Violeta Bielinska</p>
            <a href="mailto:example@email.com">example@email.com</a>
            <a href="tel:+1234567890"> +1234567890</a>
            <a href="https://github.com/vbielinska" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/violeta-bielinska-9b9603398/?locale=en" target="_blank"
                rel="noopener noreferrer">LinkedIn</a>
        </address>

        <form action="#" method="post">

            <label for="nimi">Nimi:</label>
            <input type="text" id="nimi" name="nimi" required>

            <label for="sahkoposti">Sähköposti:</label>
            <input type="email" id="sahkoposti" name="sahkoposti" required>

            <label for="aihe">Aihe:</label>
            <input type="text" id="aihe" name="aihe" required>

            <label for="viesti">Viesti:</label>
            <textarea id="viesti" name="viesti" rows="6" required></textarea>

            <button type="submit">Lähetä</button>

        </form>

        <form action="#" method="post">

            <label for="kayttajanimi">Käyttäjänimi:</label>
            <input type="text" id="kayttajanimi" name="kayttajanimi" required>

            <label for="sahkoposti">Sähköposti:</label>
            <input type="email" id="sahkoposti" name="sahkoposti" required>

            <label for="salasana">Salasana:</label>
            <input type="password" id="salasana" name="salasana" required>

            <label for="salasanan-vahvistus">Salasanan vahvistus:</label>
            <input type="password" id="salasanan-vahvistus" name="salasanan-vahvistus" required>

            <label for="syntymapaiva">Syntymäpäivä:</label>
            <input type="date" id="syntymapaiva" name="syntymapaiva" required>

            <label>
                <input type="checkbox" name="kayttoehdot" required>
                Hyväksyn käyttöehdot
            </label>

            <button type="submit">Rekisteröidy</button>

        </form>

    </main>
    <footer>
        <p>&copy; 2026 Violeta Bielinska</p>
    </footer>
</body>

</html>
