<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yhteys</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>

<body>
    <header>
        <h1>Yhteys</h1>
        <p>Haluatko ottaa minuun yhteyttä? Lähetä minulle viesti!</p>
    </header>

    <hr>

    <main class="container">
        <h2>Yhteystietoni</h2>
        <address>
            <p style="font-size: 1.2em;"><strong>Violeta Bielinska</strong></p>
            <p>Sähköposti: <a href="mailto:example@email.com">example@email.com</a></p>
            <p>Puhelin: <a href="tel:+1234567890"> +1234567890</a></p>
            <p>Some: <a href="https://github.com/vbielinska" target="_blank" rel="noopener noreferrer">GitHub</a>; 
            <a href="https://www.linkedin.com/in/violeta-bielinska-9b9603398/?locale=en" target="_blank"
                rel="noopener noreferrer">LinkedIn</a></p>
        </address>

        <h2>Lähetä viesti</h2>
        <form action="https://httpbin.org/post" method="post">
            <fieldset>
                <div>
                    <label for="name">Nimi: </label>
                    <input type="text" id="name" name="name" placeholder="Nimesi" autocomplete="on" required>
                </div>
                <div>
                    <label for="email">Sähköposti: </label>
                    <input type="email" id="email" name="email" autocomplete="off" placeholder="Sähköpostisi" required>
                </div>
                <div>
                    <label for="message">Viesti: </label>
                    <br>
                    <textarea name="message" id="message" cols="30" rows="10"
                        placeholder="Kirjoita viestisi tähän"></textarea>
                    
                </div>
                <div>
                    <button type="submit" formaction="https://httpbin.org/post" formmethod="post">Lähetä</button>
                    <button type="reset">Nollaa</button>
                </div>
            </fieldset>
        </form>

    </main>
    <footer>
        <nav>
            <a href="index.html">Etusivu</a>
        </nav>
        <p>&copy; 2026 Violeta Bielinska</p>
    </footer>
</body>

</html>
