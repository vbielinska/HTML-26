<!-- 1. Luo ensimmäinen HTML-tiedosto -->
<!DOCTYPE html>`
<!-- 2. Lisää sivun kieli ja merkistö -->
<html lang="fi">
<!-- 3. Lisää viewport ja title-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikä on HTML</title>
</head>
<!-- 4. Tee näkyvä sivusisältö -->
<!-- 5. Lisää HTML-kommentti -->
<!-- Tämä on HTML-kommentti -->
<!-- 6. Tee oma esittelysivu -->
<body>
    <h1>Violeta Bielinska</h1>
    <p>Opiskelen HTML:n perusteita.</p>
    <p>Haluan oppia rakentamaan selkeitä verkkosivuja.</p>
</body>
</html>
